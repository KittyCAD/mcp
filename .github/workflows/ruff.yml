name: ruff
permissions:
  contents: read
on:
  pull_request:
    paths:
      - '**.py'
      - .github/workflows/ruff.yml
      - 'pyproject.toml'
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Ruff Check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: 'pyproject.toml'
          args: 'check'

      - name: Ruff Format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: 'pyproject.toml'
          args: 'format --check'
