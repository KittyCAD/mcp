name: Hosted workers
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux-confinement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --python 3.13
      - run: uv run pytest tests/test_hosted_pool.py
      - run: uv run python scripts/check_hosted_workers.py
