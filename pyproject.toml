[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "zoo_mcp"
version = "0.18.1"
requires-python = ">=3.11, <3.14"
dependencies = [
    "aiofiles<26.0",
    "kittycad>=1.4.0,<2.0",
    "mcp[cli]>=1.27.1,<2.0",
    "pillow<13.0",
    "trimesh<5.0",
    "truststore<1.0",
    "typing-extensions>=4.12",
    "zoo-kcl>=0.3.170",
]
authors = [
    { name = "Ryan Barton", email = "ryan@zoo.dev" },
]
maintainers = [
    { name = "Ryan Barton", email = "ryan@zoo.dev" }
]
description = "An MCP server utilizing Zoo's various tools"
readme = "README.md"
license-files = ["LICENSE"]
license = "MIT"
keywords = ["zoo", "mcp", "kittycad", "3d", "modeling", "server"]
classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",

    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/KittyCAD/mcp"

[project.scripts]
zoo-mcp = "zoo_mcp.server:main"

[tool.pytest.ini_options]
# `--dist loadgroup` behaves exactly like the default `load` except that tests
# sharing an `xdist_group` marker go to the same worker, so a module-scoped
# fixture they share is set up once instead of once per worker. xdist ignores
# `--dist` when no `-n` is given, so a plain `pytest` run is unaffected.
addopts = "--strict-markers --dist loadgroup"
markers = [
    "live: hits live external services (zoo.dev). Runs by default; deselect locally with `-m 'not live'`.",
    "slow: takes minutes rather than seconds. Runs by default; deselect locally with `-m 'not slow'`.",
]

[tool.ruff.lint]
extend-select = ["F", "I"]
ignore = ["BLE001"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.*"]

[dependency-groups]
dev = [
    "pytest-asyncio",
    "pytest-httpx",
    "pytest-rerunfailures",
    "pytest-xdist",
    "ruff==0.16.0",
    "ty",
    "uv-build",
]
